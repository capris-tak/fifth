<!doctype html>
<html><head><meta charset="utf-8"><title>Hoshi test</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../src/util.js"></script>
<script src="../src/timeline.js"></script>
<script src="../src/hoshi.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function label(txt, x, y){ ctx.fillStyle='rgba(220,225,255,.7)'; ctx.font='20px IPAGothic, sans-serif'; ctx.textAlign='center'; ctx.fillText(txt, x, y); }
window.renderFrame = function(t){
  ctx.setTransform(1,0,0,1,0,0);
  const g = ctx.createLinearGradient(0,0,0,1080);
  g.addColorStop(0,'#070a24'); g.addColorStop(.5,'#141a4a'); g.addColorStop(1,'#2b2366');
  ctx.fillStyle = g; ctx.fillRect(0,0,1920,1080);
  // ground strips under each row
  ctx.fillStyle = '#2f6b5a';
  for (const gy of [330, 640, 950]) { ctx.beginPath(); ctx.ellipse(960, gy+260, 1300, 270, 0, Math.PI, 0); ctx.fill(); }
  if (location.hash==='#close'){
    const m = TL.mouth('hoshi', t);
    Hoshi.draw(ctx, t, {x:340,y:520,scale:3.4,bright:.05,flicker:1,expr:'sad',mouth:m});
    Hoshi.draw(ctx, t, {x:960,y:520,scale:3.4,bright:.5,flicker:.2,expr:'hope'});
    Hoshi.draw(ctx, t, {x:1580,y:520,scale:3.4,bright:1,expr:t>30?'joy':'gentle',mouth:m});
    label('mouth='+m, 960, 1000); return;
  }
  if (location.hash==='#vis'){
    'aiueoncx'.split('').forEach((v,i)=>{ const x=130+(i%4)*440+(i>3?220:0)*0, y=i<4?260:760;
      Hoshi.draw(ctx, t, {x:x+100,y,scale:2.6,bright:i%2?.9:.1,flicker:.5,expr:'gentle',mouth:v,seed:i,blink:false,halo:.3});
      label(v, x+100, y+200); });
    return;
  }
  // row 1: brightness lineup
  const br = [[0,'hurt',1],[0.3,'sad',.6],[0.6,'hope',.2],[1,'joy',0]];
  br.forEach(([b,e,f],i)=>{ const x=200+i*330, y=230;
    Hoshi.draw(ctx, t, {x,y,scale:1.3,bright:b,flicker:f,expr:e,seed:i});
    label(`bright ${b} / ${e}`, x, 340); });
  // speaking (real timeline)
  {
    const sp = t<35 ? {bright:.08, flicker:.8, expr:'sad'} : {bright:1, flicker:0, expr:'joy'};
    const m = TL.mouth('hoshi', t);
    Hoshi.draw(ctx, t, Object.assign({x:1620, y:250, scale:2, mouth:m, seed:9}, sp));
    label(`speaking t=${t.toFixed(2)} mouth=${m}`, 1620, 420);
  }
  // row 2: expressions (bright .85)
  Hoshi.EXPRS.forEach((e,i)=>{ const x=170+i*316, y=560;
    Hoshi.draw(ctx, t, {x,y,scale:1.15,bright:.85,expr:e,seed:i+3, squash: e==='surprised'?0:0});
    label(e, x, 660); });
  // row 3: visemes
  'aiueoncx'.split('').forEach((v,i)=>{ const x=150+i*232, y=880;
    Hoshi.draw(ctx, t, {x,y,scale:1.2,bright:i%2?.95:.15,flicker:.3,expr:'gentle',mouth:v,seed:i+11,blink:false, halo:.4});
    label(v, x, 985); });
  // perf
  const pc = U.buf('perf',1920,1080).getContext('2d');
  const p0 = performance.now();
  for (let k=0;k<20;k++) Hoshi.draw(pc, t, {x:960,y:540,scale:2,bright:1,expr:'joy',mouth:'a'});
  const p1 = performance.now();
  for (let k=0;k<20;k++) Hoshi.draw(pc, t, {x:960,y:540,scale:2,bright:0,flicker:1,expr:'sad'});
  pc.getImageData(0,0,1,1); const p2 = performance.now();
  console.warn(`PERF bright ${( (p1-p0)/20).toFixed(2)}ms  dim ${((p2-p1)/20).toFixed(2)}ms`);
};
window.READY = true;
</script></body></html>
