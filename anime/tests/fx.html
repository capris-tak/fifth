<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../src/util.js"></script>
<script src="../src/fx.js"></script>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const cam={x:0,y:-330,zoom:1};
window.TIMES={};
function bg(t){
  ctx.setTransform(1,0,0,1,0,0);
  const g=ctx.createLinearGradient(0,0,0,1080);
  g.addColorStop(0,'#070a24');g.addColorStop(.5,'#141a4a');g.addColorStop(.85,'#2b2366');g.addColorStop(1,'#3a2a5e');
  ctx.fillStyle=g;ctx.fillRect(0,0,1920,1080);
  const r=U.rng(5);ctx.fillStyle='#fff';
  for(let i=0;i<260;i++){const x=r()*1920,y=r()*800,s=r()*1.6+.3;ctx.globalAlpha=.3+.6*Math.abs(Math.sin(t*(1+r()*2)+i));ctx.fillRect(x,y,s,s);}
  ctx.globalAlpha=1;
  U.camApply(ctx,cam);
  // ground + lighthouse silhouette
  ctx.fillStyle='#16204a';ctx.fillRect(-1200,0,2400,600);
  ctx.strokeStyle='#4f9a74';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-1200,0);ctx.lineTo(1200,0);ctx.stroke();
  ctx.fillStyle='#1c1a3a';ctx.beginPath();ctx.moveTo(220,0);ctx.lineTo(240,-560);ctx.lineTo(300,-560);ctx.lineTo(320,0);ctx.fill();
  ctx.fillRect(225,-620,90,60);
}
const lh=[[860,140],[800,330],[920,330],[760,560],[960,560],[860,60],[700,250],[1020,250]];
const lhL=[[0,1],[0,2],[1,3],[2,4],[3,4],[0,5],[5,6],[5,7]];
window.renderFrame=function(t){
  const T={};let s=performance.now();
  const mark=k=>{if(window.FLUSH)ctx.getImageData(0,0,1,1);const n=performance.now();T[k]=(n-s);s=n;};
  bg(t);mark('bg');
  U.camApply(ctx,cam);
  FX.motes(ctx,t,{x:-900,y:-500,w:1800,h:480,count:30,seed:3});mark('motes');
  FX.shootingStar(ctx,t,{x0:-1100,y0:-900,x1:-140,y1:0,t0:0,t1:1.6,arc:-60});mark('shootingStar');
  FX.impact(ctx,t,{x:-140,y:0,t0:1.62});mark('impact');
  FX.absorb(ctx,t,{x:-140,y:-120,t0:3,t1:5.6});mark('absorb');
  FX.burst(ctx,t,{x:-140,y:-120,t0:5.6,groundY:0});mark('burst');
  FX.trail(ctx,t,{path:tt=>{const k=(tt-8)/2;return[-500+1000*k,-150-350*k+Math.sin(k*9)*60];},t0:8,t1:10});mark('trail');
  ctx.setTransform(1,0,0,1,0,0);
  FX.constellation(ctx,t,{points:lh,lines:lhL,t0:11,t1:14,hero:5});mark('constellation');
  FX.title(ctx,t,{t0:15});mark('title');
  FX.credits(ctx,t,{t0:16});mark('credits');
  if(!window.NOPOST)FX.bloom(ctx,1);mark('bloom');
  FX.vignette(ctx,.8);mark('vignette');
  FX.grain(ctx,t,.06);mark('grain');
  FX.fade(ctx,1-U.clamp(t/.4));mark('fade');
  window.TIMES[t]=T;
};
window.READY=true;
</script></body></html>
