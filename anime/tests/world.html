<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../src/util.js"></script><script src="../src/timeline.js"></script><script src="../src/world.js"></script>
<script>
const ctx=document.getElementById('c').getContext('2d');
window.renderFrame=function(t){
  let cam, o={doorOpen:0,lampOn:1,lampAngle:t*0.8,windowsLit:1}, beam=null, bloom=0, aur=1, gallery=false;
  if(t<5){ const k=t/5; cam={x:U.lerp(-100,0,k),y:U.lerp(-2200,-1700,k),zoom:0.6}; }
  else if(t<10){ cam={x:0,y:-260,zoom:0.62}; aur=0.6; beam={angle:0.25+0.1*Math.sin(t),length:1500,width:360,intensity:0.6}; }
  else if(t<15){ cam={x:-80,y:-120,zoom:2.2}; aur=0.4; o.doorOpen=0; bloom=1; }
  else if(t<20){ cam={x:40,y:-330,zoom:1.0}; aur=0.4; o.doorOpen=1; beam={angle:Math.PI/2+0.6+0.3*Math.sin(t*2),length:1100,width:300,intensity:1}; }
  else { cam={x:260,y:-820,zoom:1.9}; aur=0.7; gallery=true; o.noRail=true; }
  const t0=performance.now();
  ctx.setTransform(1,0,0,1,0,0);
  World.sky(ctx,cam,t,{aurora:aur,starBoost:0});
  World.cloudsBack(ctx,cam,t);
  U.camApply(ctx,cam);
  World.island(ctx,t,{bloom});
  World.lighthouse(ctx,t,o);
  if(gallery){ ctx.fillStyle='#e2474f'; ctx.fillRect(LH.x-80,World.LH.galleryY-165,30,165); World.galleryRail(ctx,t,{lampOn:1}); }
  if(beam) World.beam(ctx,t,beam);
  if(o.doorOpen) World.lightPool(ctx,-140,World.groundY(-140),180,0.8);
  World.cloudsFront(ctx,cam,t);
  ctx.setTransform(1,0,0,1,0,0);
  const ms=performance.now()-t0; ctx.fillStyle='#fff'; ctx.font='20px monospace'; ctx.fillText(ms.toFixed(1)+' ms',20,30);
  console.warn('frame',t,ms.toFixed(1));
};
const LH=World.LH;
// warm caches
window.renderFrame(0); window.renderFrame(0);
window.READY=true;
</script></body></html>
